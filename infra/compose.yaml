name: defence-garden-hr-local
services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: hr_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?required}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?required}
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - hr_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_local"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:56379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["hr_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: chrislusf/seaweedfs:4.47
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?required}
      S3_BUCKET: ${S3_BUCKET:-hr-private}
    ports: ["127.0.0.1:59000:8333"]
    volumes: ["hr_objects:/data"]
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:51025:1025", "127.0.0.1:58025:8025"]
volumes:
  hr_pg:
  hr_redis:
  hr_objects:
