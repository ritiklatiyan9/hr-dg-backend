name: defence_garden_employee
description: Defence Garden employee app. Authorized, site-scoped HR access.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  graphql: ^5.2.3
  gql: ^1.0.1
  gql_exec: ^1.1.1-alpha+1699813812660
  gql_link: ^1.1.0
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0
  drift: ^2.30.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.2
  geolocator: ^14.0.3
  cryptography: ^2.9.0
  battery_plus: ^7.1.1
  image_picker: ^1.2.3
  permission_handler: ^12.0.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  printing: ^5.15.1
  pdf: ^3.13.1
  cupertino_icons: 1.0.9
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.0
  graphql_codegen: ^3.0.0
  drift_dev: ^2.30.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE-Lucide.txt
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-NotoSansDevanagari.txt
  fonts:
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
